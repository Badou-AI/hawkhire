services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: deps # Use the deps stage for development
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - API_URL=http://backend:8080
    command: npm run dev
    networks:
      - hawkhire-network
    depends_on:
      backend:
        condition: service_healthy
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - /app/venv
    environment:
      - PYTHONPATH=/app
      - ENVIRONMENT=development
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - hawkhire-network

networks:
  hawkhire-network:
    driver: bridge 