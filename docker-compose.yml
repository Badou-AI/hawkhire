services:
  frontend:
    build:
      context: ./frontend
      target: deps # Use the deps stage for development
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - API_URL=http://backend:8080
    command: npm run dev
    networks:
      - hawkhire-network
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - /app/venv
    environment:
      - PYTHONPATH=/app
      - ENVIRONMENT=development
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload
    networks:
      - hawkhire-network

networks:
  hawkhire-network:
    driver: bridge 